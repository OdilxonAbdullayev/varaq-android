<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#263F36">
<title>VARAQ — Kitobxonning shaxsiy olami</title>
<style>
:root{--bg:#f7f3eb;--surf:#fffdfa;--forest:#263f36;--text:#292b29;--sub:#7e8279;--gold:#c19a6b;--line:#e9e5dd;--mint:#e8eee5;--shadow:0 10px 40px #14251a12}
*{box-sizing:border-box}body{margin:0;background:#e9e6df;color:var(--text);font:14px/1.48 system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.48;cursor:not-allowed}#shell{max-width:500px;min-height:100dvh;margin:auto;background:var(--bg);box-shadow:0 10px 50px #1c281629;position:relative;padding-bottom:85px}body.dark{--bg:#151b18;--surf:#202923;--forest:#bad4c0;--text:#edece4;--sub:#acb6ad;--gold:#d5b88a;--line:#39443b;--mint:#304038;background:#09110d}body.dark #shell{box-shadow:none}.topbar{padding:25px 20px 14px;display:flex;justify-content:space-between;align-items:center}.brand{font:700 26px Georgia,serif;letter-spacing:2px;color:var(--forest)}.overline{font-size:10px;font-weight:700;letter-spacing:2.1px;color:var(--sub);text-transform:uppercase}.roundbtn{width:41px;height:41px;border-radius:14px;background:var(--surf);border:1px solid var(--line);color:var(--forest);font-size:19px}.content{padding:5px 20px 25px}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Georgia,serif;color:var(--forest);font-weight:500;line-height:1.1}h1{font-size:31px;letter-spacing:-.7px}h2{font-size:23px}h3{font-size:19px}.sub{color:var(--sub);font-size:13px}.card{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--shadow)}.stack{display:flex;flex-direction:column;gap:17px}.row{display:flex;align-items:center;gap:13px}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}.grow{flex:1;min-width:0}.btn{border:0;border-radius:13px;background:var(--forest);color:var(--bg);padding:13px 16px;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}.btn.secondary{background:var(--mint);color:var(--forest)}.btn.outline{background:transparent;border:1px solid var(--line);color:var(--forest)}.btn.full{width:100%}.btn.danger{background:#9f4242;color:white}.cover{width:92px;height:136px;border-radius:6px 10px 10px 6px;flex-shrink:0;box-shadow:3px 4px 10px #0002;background:linear-gradient(145deg,#384f40,#8a8b64);color:#fff;font:16px Georgia,serif;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-word;overflow:hidden;padding:8px}.cover img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain}.cover.small{width:74px;height:107px;font-size:12px}.cover.big{width:122px;height:185px}.progress{height:8px;background:var(--mint);border-radius:15px;overflow:hidden}.progress b{display:block;height:100%;background:var(--forest);border-radius:15px}.tiny{font-size:11px;color:var(--sub)}.metric{flex:1;min-width:0}.metric strong{font:32px Georgia,serif;color:var(--forest);display:block}.metric .card{height:111px}.nav{display:flex;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;z-index:15;background:var(--surf);border-top:1px solid var(--line);padding:10px 5px max(10px,env(safe-area-inset-bottom));justify-content:space-around}.nav button{border:0;background:transparent;color:var(--sub);font-size:10px;padding:4px 4px;text-align:center;min-width:67px}.nav button .sym{display:block;font-size:23px;margin-bottom:3px}.nav button.active{color:var(--forest);font-weight:800}.chipline{display:flex;gap:7px;overflow:auto;padding:2px 0 9px;scrollbar-width:none}.chip{white-space:nowrap;min-height:34px;border:1px solid var(--line);background:var(--surf);color:var(--sub);border-radius:20px;padding:7px 12px;font-size:12px}.chip.active{background:var(--forest);color:var(--bg);border-color:var(--forest)}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;font-weight:650;color:var(--forest)}input,textarea,select{border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;background:var(--surf);color:var(--text);outline:none}input:focus,textarea:focus,select:focus{border-color:var(--forest)}textarea{min-height:93px;resize:vertical}.bookrow{display:flex;gap:14px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:18px;background:var(--surf);cursor:pointer}.bookrow .title{font-weight:750;font-size:15px;line-height:1.35}.status{font-size:10px;color:var(--forest);background:var(--mint);padding:5px 9px;border-radius:10px;display:inline-block}.bookrow p{color:var(--sub);font-size:12px;margin:5px 0 10px}.blank{text-align:center;padding:34px 17px;color:var(--sub)}.blank .emoji{font-size:45px;display:block;margin-bottom:12px}.blank h3{margin-bottom:7px}.bargraph{height:140px;display:flex;gap:9px;align-items:end}.barcolumn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:6px;height:100%}.bar{width:65%;min-height:5px;border-radius:8px 8px 0 0;background:var(--forest)}.barcolumn:last-child .bar{background:var(--gold)}.barcolumn span{font-size:10px;color:var(--sub)}.line{height:1px;background:var(--line)}.quote{border-left:3px solid var(--gold);padding-left:12px;font:italic 16px/1.5 Georgia,serif}.toast{position:fixed;z-index:90;bottom:90px;left:50%;transform:translateX(-50%);background:#263f36;color:white;padding:10px 15px;border-radius:9px;max-width:440px;box-shadow:0 7px 20px #0004;text-align:center}.startscreen{padding:55px 24px}.bigicon{font-size:64px}.spinner{display:inline-block;width:11px;height:11px;border-radius:100%;background:var(--gold)}.star{font-size:27px;background:transparent;border:0;color:var(--gold);padding:1px 4px}.feature{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.badge{display:inline-block;font-size:11px;background:var(--mint);color:var(--forest);padding:6px 10px;border-radius:12px}#filePicker,#jsonPicker{display:none}@media(min-width:700px){#shell{margin-top:22px;min-height:calc(100dvh - 44px);border-radius:23px;overflow:hidden}.nav{bottom:22px;border-radius:0 0 23px 23px}}@media(max-width:360px){.content{padding-left:14px;padding-right:14px}.topbar{padding-left:14px;padding-right:14px}}
</style>
</head><body><div id="shell"><div id="app"></div></div><input type="file" id="filePicker" accept="image/*"><input type="file" id="jsonPicker" accept="application/json,.json">
<script>
'use strict';
const KEY='varaq_browser_demo_v1';
const initial=()=>({name:'',dailyGoal:20,annualGoal:20,dark:false,founder:false,reminders:false,books:[],notes:[],sessions:[]});
let data;try{data={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{data=initial()}
let tab='home',view='',selectedId=0,filter='ALL',search='',editorCover='',timerSec=0,timerOn=false,timerRef=null,lastTick=0,noteFilter=0;
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('en-US').format(n||0).replaceAll(',',' ');
const titleStatus=s=>({READING:'O‘qilmoqda',FINISHED:'Tugatilgan',WISHLIST:'Rejada'}[s]||'Rejada');
const getBook=id=>data.books.find(b=>b.id===Number(id));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{toast('Xotira to‘ldi. Zaxira eksport qiling.');return false}};
const todayKey=t=>new Date(t).toLocaleDateString('en-CA');
const pagesToday=()=>data.sessions.filter(s=>todayKey(s.finishedAt)===todayKey(Date.now())).reduce((a,s)=>a+Math.max(0,s.endPage-s.startPage),0);
const pageCount=()=>data.sessions.reduce((a,s)=>a+Math.max(0,s.endPage-s.startPage),0);
const yearDone=()=>data.books.filter(b=>b.status==='FINISHED'&&b.finishedAt&&new Date(b.finishedAt).getFullYear()===new Date().getFullYear()).length;
const streak=()=>{let t=new Date();t.setHours(0,0,0,0);const keys=new Set(data.sessions.filter(s=>s.durationMillis>0||s.endPage>s.startPage).map(s=>todayKey(s.finishedAt)));if(!keys.has(todayKey(t)))t.setDate(t.getDate()-1);let n=0;while(keys.has(todayKey(t))){n++;t.setDate(t.getDate()-1)}return n};
const cover=b=>`<div class="cover ${argumentsCoverSize(b)}" style="background:${['#344b40','#8e6c51','#6f5c67','#4b5b75'][Math.abs(String(b.title).length)%4]}">${b.cover?`<img src="${b.cover}" alt="muqova">`:esc((b.title||'Yangi kitob').toUpperCase())}</div>`;
function argumentsCoverSize(b){return b.coverSize||''}
const progress=b=>`<div class="between tiny"><span>${b.currentPage}/${b.totalPages} sahifa</span><b>${Math.round(100*(b.currentPage||0)/(b.totalPages||1))}%</b></div><div class="progress" style="margin-top:7px"><b style="width:${Math.min(100,Math.max(0,100*(b.currentPage||0)/(b.totalPages||1)))}%"></b></div>`;
const bookrow=b=>`<div class="bookrow" onclick="openBook(${b.id})">${cover({...b,coverSize:'small'})}<div class="grow"><div class="title">${esc(b.title)}</div><p>${esc(b.author||'Muallif ko‘rsatilmagan')}</p><span class="status">${titleStatus(b.status)}</span>${b.status!=='WISHLIST'?`<div style="margin-top:9px">${progress(b)}</div>`:''}</div></div>`;
const header=(name,caption='',back=false,extra='')=>`<header class="topbar"><div>${back?`<button class="roundbtn" onclick="back()">‹</button>`:`<span class="brand">${name||'VARAQ.'}</span>`}</div><div>${back?`<span class="sub">${esc(caption)}</span>`:extra||'<button class="roundbtn" onclick="openSettings()">⚙</button>'}</div></header>`;
const nav=()=>`<nav class="nav">${[['home','⌂','Bosh sahifa'],['library','▤','Kutubxona'],['journal','✎','Kundalik'],['stats','▥','Natijalar']].map(([t,i,n])=>`<button class="${tab===t?'active':''}" onclick="navigate('${t}')"><span class="sym">${i}</span>${n}</button>`).join('')}</nav>`;
function toast(msg){document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}
function render(){document.body.classList.toggle('dark',data.dark);if(!data.name){$('app').innerHTML=onboarding();return}let html='';if(view==='settings')html=settingsPage();else if(view==='edit')html=editorPage();else if(view==='detail')html=detailPage();else if(view==='session')html=sessionPage();else if(view==='newNote')html=notePage();else html=({home:homePage,library:libraryPage,journal:journalPage,stats:statsPage}[tab]||homePage)();$('app').innerHTML=html+(view?'':nav());if(view==='session')updateClock()}
function onboarding(){return `<div class="startscreen stack"><div class="bigicon">📖</div><div class="brand">VARAQ.</div><h1>Har bir sahifa — yangi hikoya.</h1><p class="sub">Shaxsiy kutubxona, o‘qish kundaligi va kichik muvaffaqiyatlaringiz — bir joyda.</p><section class="card stack"><h2>Tanishib olaylik</h2><div class="field"><label>Ismingiz</label><input id="onName" placeholder="Masalan, Munisa" maxlength="40"></div><div class="field"><label>Kunlik sahifa maqsadi</label><input id="onDaily" type="number" min="1" value="20"></div><div class="field"><label>Yillik kitob maqsadi</label><input id="onAnnual" type="number" min="1" value="20"></div><button class="btn full" onclick="onboard()">VARAQ'ni boshlash →</button></section><div class="tiny" style="text-align:center">Ushbu brauzer demosi ma'lumotlarni faqat qurilmangizda saqlaydi.</div></div>`}
function onboard(){let name=$('onName').value.trim(),d=Number($('onDaily').value),a=Number($('onAnnual').value);if(!name||d<1||a<1){toast('Ism va maqsadlarni to‘g‘ri kiriting');return}Object.assign(data,{name,dailyGoal:d,annualGoal:a});save();render()}
function homePage(){let reading=data.books.find(b=>b.status==='READING');let count=pagesToday(),st=streak();return `${header('VARAQ.')}<main class="content stack"><div><h1>Salom, ${esc(data.name)}!</h1><p class="sub">Bugun yana bir sahifa o‘qiymizmi?</p></div>${reading?`<section class="card stack"><div class="overline">Hozir o‘qilmoqda</div><div class="row">${cover(reading)}<div class="grow"><h3>${esc(reading.title)}</h3><p class="sub">${esc(reading.author)}</p><div style="margin-top:18px">${progress(reading)}</div></div></div><button class="btn full" onclick="openSession(${reading.id})">▶ O‘qishni davom ettirish</button></section>`:`<section class="card stack"><h2>Yangi hikoyani boshlang</h2><p class="sub">Birinchi kitobingizni qo‘shing yoki o‘qish rejasini boshlang.</p><button class="btn" onclick="newBook()">＋ Kitob qo‘shish</button></section>`}<div class="row"><div class="metric"><div class="card"><span class="tiny">Bugun o‘qildi</span><strong>${count}</strong><span class="tiny">${data.dailyGoal} sahifa maqsad</span></div></div><div class="metric"><div class="card"><span class="tiny">Ketma-ket</span><strong>${st}</strong><span class="tiny">kun</span></div></div></div><div class="card stack"><div class="between"><b>Bugungi maqsad</b><span>${count}/${data.dailyGoal}</span></div><div class="progress"><b style="width:${Math.min(100,100*count/data.dailyGoal)}%"></b></div><p class="sub">${count>=data.dailyGoal?'Bugungi maqsad bajarildi! ✨':`Yana ${data.dailyGoal-count} sahifa qoldi.`}</p></div><div class="between"><h2>Mening kitoblarim</h2><button class="chip" onclick="navigate('library')">Barchasi →</button></div>${data.books.length?data.books.slice(0,3).map(bookrow).join(''):`<div class="blank"><span class="emoji">📚</span><h3>Kutubxonangiz bo‘sh</h3>Har bir kitob bilan yangi xotiralar boshlanadi.</div>`}${data.founder?'<div class="badge">✦ Founder Reader — Ilk kitobxon</div>':''}</main>`}
function libraryPage(){let items=data.books.filter(b=>(filter==='ALL'||b.status===filter)&&(b.title.toLowerCase().includes(search.toLowerCase())||b.author.toLowerCase().includes(search.toLowerCase())));return `${header('VARAQ.','','',`<button class="roundbtn" onclick="newBook()">＋</button>`)}<main class="content stack"><div><h1>Kutubxonam</h1><p class="sub">Kitoblar bilan to‘la kichik olamingiz</p></div><input placeholder="⌕  Kitob yoki muallif qidirish" value="${esc(search)}" oninput="search=this.value;document.getElementById('results').innerHTML=libraryResults()"><div class="chipline">${[['ALL','Barchasi'],['READING','O‘qilmoqda'],['FINISHED','O‘qilgan'],['WISHLIST','Rejada']].map(([s,n])=>`<button class="chip ${s===filter?'active':''}" onclick="filter='${s}';render()">${n}</button>`).join('')}</div><div id="results" class="stack">${items.length?items.map(bookrow).join(''):`<div class="blank"><span class="emoji">📖</span><h3>Kitob topilmadi</h3>Yangi kitob qo‘shing yoki qidiruvni o‘zgartiring.</div>`}</div><button class="btn full outline" onclick="newBook()">＋ Yangi kitob qo‘shish</button></main>`}
function libraryResults(){let items=data.books.filter(b=>(filter==='ALL'||b.status===filter)&&(b.title.toLowerCase().includes(search.toLowerCase())||b.author.toLowerCase().includes(search.toLowerCase())));return items.length?items.map(bookrow).join(''):'<div class="blank">Kitob topilmadi</div>'}
function journalPage(){let ns=data.notes.filter(n=>noteFilter===0||n.bookId===noteFilter);return `${header('VARAQ.','','',`<button class="roundbtn" onclick="newNote()">＋</button>`)}<main class="content stack"><div><h1>Kitob kundaligi</h1><p class="sub">Iqtiboslar, fikrlar va xotiralar</p></div><div class="chipline"><button class="chip ${noteFilter===0?'active':''}" onclick="noteFilter=0;render()">Barcha kitoblar</button>${data.books.map(b=>`<button class="chip ${noteFilter===b.id?'active':''}" onclick="noteFilter=${b.id};render()">${esc(b.title)}</button>`).join('')}</div>${ns.length?ns.map(n=>`<div class="card stack"><div class="between"><span class="overline">${n.kind==='QUOTE'?'❝ Iqtibos':'✎ Fikr'}</span><button class="chip" onclick="deleteNote(${n.id})">O‘chirish</button></div><div class="quote">${esc(n.text)}</div><p class="tiny">${esc(getBook(n.bookId)?.title||'Kitob')}${n.page?' • '+n.page+'-sahifa':''}</p></div>`).join(''):`<div class="blank"><span class="emoji">✍️</span><h3>Hali qayd yo‘q</h3>Kitobdan olgan saboqlaringiz va iqtiboslarni saqlang.</div>`}<button class="btn full" onclick="newNote()">＋ Qayd qo‘shish</button></main>`}
function statsPage(){let days=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return d}),points=days.map(d=>data.sessions.filter(s=>todayKey(s.finishedAt)===todayKey(d)).reduce((a,s)=>a+Math.max(0,s.endPage-s.startPage),0)),mx=Math.max(20,...points);let done=data.books.filter(b=>b.status==='FINISHED').length;return `${header('VARAQ.')}<main class="content stack"><div><h1>Sening natijalaring</h1><p class="sub">Har bir sahifa hisobda.</p></div><div class="row"><div class="metric card"><span class="tiny">Tugatilgan kitob</span><strong>${done}</strong></div><div class="metric card"><span class="tiny">Jami sahifa</span><strong>${fmt(pageCount())}</strong></div></div><div class="row"><div class="metric card"><span class="tiny">O‘qish vaqti</span><strong>${Math.floor(data.sessions.reduce((a,s)=>a+s.durationMillis,0)/3600000)}</strong><span class="tiny">soat</span></div><div class="metric card"><span class="tiny">Ketma-ket</span><strong>${streak()}</strong><span class="tiny">kun</span></div></div><div class="card stack"><h3>Oxirgi 7 kun</h3><p class="tiny">Har kuni o‘qilgan sahifalar</p><div class="bargraph">${points.map((n,i)=>`<div class="barcolumn"><span>${n}</span><div class="bar" style="height:${Math.round(100*n/mx)+10}px"></div><span>${['Yak','Dush','Sesh','Chor','Pay','Jum','Shan'][days[i].getDay()]}</span></div>`).join('')}</div></div><div class="card stack"><div class="between"><h3>${new Date().getFullYear()}-yilgi maqsad</h3><span>${yearDone()}/${data.annualGoal}</span></div><div class="progress"><b style="width:${Math.min(100,100*yearDone()/data.annualGoal)}%"></b></div><p class="sub">Yana ${Math.max(0,data.annualGoal-yearDone())} ta kitob qoldi.</p></div><div class="card stack"><h3>Yutuqlar</h3>${[['🌱','Ilk sahifa',pageCount()>0],['🔥','7 kunlik odat',streak()>=7],['📚','5 ta kitob',done>=5],['🏆','1000 sahifa',pageCount()>=1000]].map(([ic,n,on])=>`<div class="between"><span>${ic} ${n}</span><span class="tiny">${on?'Olingan ✓':'Hali yo‘q'}</span></div>`).join('')}</div></main>`}
function openBook(id){selectedId=id;view='detail';render()}
function detailPage(){let b=getBook(selectedId);if(!b)return back(),'';let bookNotes=data.notes.filter(n=>n.bookId===b.id),sess=data.sessions.filter(s=>s.bookId===b.id);return `${header('','Kitob haqida',true)}<main class="content stack"><div class="row">${cover({...b,coverSize:'big'})}<div class="grow stack"><h1 style="font-size:26px">${esc(b.title)}</h1><p class="sub">${esc(b.author||'Muallif noma’lum')}</p><span class="status">${titleStatus(b.status)}</span><p class="sub">${esc(b.genre)}</p></div></div><div class="card stack">${progress(b)}<div class="row"><div class="metric"><span class="tiny">Qaydlar</span><strong style="font:27px Georgia;color:var(--forest)">${bookNotes.length}</strong></div><div class="metric"><span class="tiny">O‘qish vaqti</span><strong style="font:27px Georgia;color:var(--forest)">${Math.round(sess.reduce((a,s)=>a+s.durationMillis,0)/60000)}</strong><span class="tiny">daqiqa</span></div></div></div>${b.rating?`<p class="sub">Bahom: <span style="color:var(--gold)">${'★'.repeat(b.rating)}</span></p>`:''}${b.review?`<div class="card stack"><h3>Taassurotim</h3><p>${esc(b.review)}</p></div>`:''}<button class="btn full" ${b.status==='FINISHED'?'disabled':''} onclick="openSession(${b.id})">${b.status==='FINISHED'?'Kitob tugatilgan ✓':'▶ O‘qishni boshlash'}</button><button class="btn full secondary" onclick="noteFilter=${b.id};navigate('journal')">✎ Qaydlar (${bookNotes.length})</button><button class="btn full outline" onclick="editBook(${b.id})">Tahrirlash</button><button class="btn full outline" style="color:#b55454" onclick="deleteBook(${b.id})">Kitobni o‘chirish</button></main>`}
function newBook(){selectedId=0;editorCover='';view='edit';render()}
function editBook(id){selectedId=id;editorCover=getBook(id)?.cover||'';view='edit';render()}
function editorPage(){let b=getBook(selectedId)||{title:'',author:'',totalPages:'',currentPage:0,status:'WISHLIST',genre:'',rating:0,review:''};return `${header('',selectedId?'Kitobni tahrirlash':'Yangi kitob',true)}<main class="content stack"><h1>${selectedId?'Kitobni tahrirlash':'Yangi kitob qo‘shish'}</h1><div class="row">${cover({...b,cover:editorCover,coverSize:'big'})}<button class="btn secondary" onclick="$('filePicker').click()">▧ Muqova tanlash</button></div><div class="field"><label>Kitob nomi *</label><input id="bt" maxlength="140" value="${esc(b.title)}" placeholder="Masalan, O‘tkan kunlar"></div><div class="field"><label>Muallif</label><input id="ba" value="${esc(b.author)}"></div><div class="field"><label>Janr</label><input id="bg" value="${esc(b.genre)}"></div><div class="row"><div class="field grow"><label>Jami sahifalar *</label><input id="bp" type="number" min="1" max="100000" value="${esc(b.totalPages)}"></div><div class="field grow"><label>O‘qilgan sahifa</label><input id="bc" type="number" min="0" value="${b.currentPage||0}"></div></div><div class="field"><label>Holati</label><select id="bs">${[['WISHLIST','Rejada'],['READING','O‘qilmoqda'],['FINISHED','Tugatilgan']].map(([v,t])=>`<option value="${v}" ${v===b.status?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Baho (0–5)</label><select id="br">${[0,1,2,3,4,5].map(v=>`<option value="${v}" ${v===(b.rating||0)?'selected':''}>${v} ★</option>`).join('')}</select></div><div class="field"><label>Shaxsiy taassurot</label><textarea id="brev">${esc(b.review)}</textarea></div><button class="btn full" onclick="saveBook()">Kitobni saqlash</button></main>`}
function saveBook(){const title=$('bt').value.trim(),author=$('ba').value.trim(),genre=$('bg').value.trim(),totalPages=Number($('bp').value),page=Number($('bc').value),status=$('bs').value,rating=Number($('br').value),review=$('brev').value;if(!title||!Number.isInteger(totalPages)||totalPages<1||totalPages>100000||!Number.isInteger(page)||page<0||page>totalPages){toast('Kitob nomi va sahifalarni to‘g‘ri kiriting');return}let old=getBook(selectedId),now=Date.now(),id=old?.id||now;let book={id,title,author,genre,totalPages,currentPage:status==='FINISHED'?totalPages:status==='WISHLIST'?0:page,status,cover:editorCover,rating,review,createdAt:old?.createdAt||now,startedAt:old?.startedAt||(status==='READING'?now:null),finishedAt:status==='FINISHED'?(old?.finishedAt||now):null,updatedAt:now};if(old)data.books=data.books.map(b=>b.id===id?book:b);else data.books.unshift(book);if(!save())return;selectedId=id;view='detail';render();toast('Kitob saqlandi ✓')}
function deleteBook(id){if(!confirm('Kitob va unga tegishli qaydlar o‘chirilsinmi?'))return;data.books=data.books.filter(b=>b.id!==id);data.notes=data.notes.filter(n=>n.bookId!==id);data.sessions=data.sessions.filter(s=>s.bookId!==id);save();view='';tab='library';render()}
function newNote(){if(!data.books.length){toast('Avval biror kitob qo‘shing');newBook();return}selectedId=noteFilter||data.books[0].id;view='newNote';render()}
function notePage(){return `${header('','Yangi qayd',true)}<main class="content stack"><h1>Yangi qayd</h1><div class="field"><label>Kitob</label><select id="nb">${data.books.map(b=>`<option value="${b.id}" ${b.id===selectedId?'selected':''}>${esc(b.title)}</option>`).join('')}</select></div><div class="field"><label>Qayd turi</label><select id="nk"><option value="QUOTE">Iqtibos</option><option value="THOUGHT">Shaxsiy fikr</option></select></div><div class="field"><label>Matn</label><textarea id="nt" placeholder="Sizni o‘ylantirgan jumlani yozing..."></textarea></div><div class="field"><label>Sahifa (ixtiyoriy)</label><input id="np" type="number" min="0" placeholder="128"></div><button class="btn full" onclick="saveNote()">Qaydni saqlash</button></main>`}
function saveNote(){const text=$('nt').value.trim();if(!text){toast('Qayd matnini yozing');return}data.notes.unshift({id:Date.now(),bookId:Number($('nb').value),kind:$('nk').value,text,page:$('np').value?Number($('np').value):null,createdAt:Date.now()});save();view='';tab='journal';render();toast('Qayd saqlandi ✓')}
function deleteNote(id){if(!confirm('Qayd o‘chirilsinmi?'))return;data.notes=data.notes.filter(n=>n.id!==id);save();render()}
function openSession(id){const b=getBook(id);if(!b||b.status==='FINISHED')return;selectedId=id;timerSec=0;timerOn=true;lastTick=Date.now();view='session';render();clearInterval(timerRef);timerRef=setInterval(()=>{if(timerOn){let now=Date.now();timerSec+=Math.max(0,Math.round((now-lastTick)/1000));lastTick=now;updateClock()}},1000)}
function updateClock(){let el=$('clock');if(el)el.textContent=`${String(Math.floor(timerSec/3600)).padStart(2,'0')}:${String(Math.floor(timerSec/60)%60).padStart(2,'0')}:${String(timerSec%60).padStart(2,'0')}`}
function toggleTimer(){timerOn=!timerOn;lastTick=Date.now();let el=$('pause');if(el)el.textContent=timerOn?'Ⅱ Pauza':'▶ Davom ettirish'}
function sessionPage(){let b=getBook(selectedId);return `${header('','O‘qish sessiyasi',true)}<main class="content stack" style="text-align:center;align-items:stretch"><div style="display:flex;justify-content:center">${cover({...b,coverSize:'big'})}</div><h2>${esc(b.title)}</h2><p class="sub">Diqqatni faqat kitobga qarating</p><div class="card stack" style="align-items:center;padding:30px"><div class="overline">O‘qish vaqti</div><div id="clock" style="font:44px Georgia,serif;color:var(--forest)">00:00:00</div><button id="pause" class="btn secondary" onclick="toggleTimer()">Ⅱ Pauza</button></div><div class="card stack" style="text-align:left"><h3>Sahifalar</h3><p class="sub">Boshlangan sahifa: ${b.currentPage}, jami: ${b.totalPages}</p><div class="field"><label>Qaysi sahifada to‘xtadingiz?</label><input id="ep" type="number" min="${b.currentPage}" max="${b.totalPages}" value="${b.currentPage}"></div></div><button class="btn full" onclick="finishSession()">O‘qishni yakunlash ✓</button><button class="btn full outline" onclick="back()">Saqlamasdan chiqish</button></main>`}
function finishSession(){const b=getBook(selectedId),ep=Number($('ep').value);if(!Number.isInteger(ep)||ep<b.currentPage||ep>b.totalPages){toast('Sahifa oralig‘i noto‘g‘ri');return}clearInterval(timerRef);timerOn=false;const now=Date.now();data.sessions.unshift({id:now,bookId:b.id,startedAt:now-timerSec*1000,finishedAt:now,startPage:b.currentPage,endPage:ep,durationMillis:timerSec*1000});b.currentPage=ep;b.status=ep===b.totalPages?'FINISHED':'READING';b.startedAt=b.startedAt||now;b.finishedAt=b.status==='FINISHED'?now:null;b.updatedAt=now;save();view='detail';render();toast('O‘qish sessiyasi saqlandi ✓')}
function openSettings(){view='settings';render()}
function settingsPage(){return `${header('','Sozlamalar',true)}<main class="content stack"><h1>Sozlamalar</h1><div class="card stack"><h3>Profil va maqsadlar</h3><div class="field"><label>Ism</label><input id="sname" value="${esc(data.name)}"></div><div class="field"><label>Kunlik sahifalar</label><input id="sdaily" type="number" value="${data.dailyGoal}"></div><div class="field"><label>Yillik kitoblar</label><input id="sannual" type="number" value="${data.annualGoal}"></div><button class="btn full" onclick="saveSettings()">Profilni saqlash</button></div><div class="card stack"><h3>Ko‘rinish</h3><div class="between"><span>Tungi rejim</span><button class="chip ${data.dark?'active':''}" onclick="data.dark=!data.dark;save();render()">${data.dark?'Yoqilgan ✓':'O‘chiq'}</button></div><p class="tiny">Brauzer demo eslatmalari faol Android bildirishnomasi emas. Bu funksiya native ilovada mavjud.</p></div><div class="card stack"><h3>Zaxira nusxasi</h3><p class="sub">Kitoblar, muqovalar, kundalik va sessiyalarni JSON formatida saqlang. Bu format VARAQ Android backup tuzilmasiga moslashtirilgan.</p><button class="btn full outline" onclick="exportBackup()">↓ Eksport qilish (.json)</button><button class="btn full outline" onclick="$('jsonPicker').click()">↑ Zaxiradan tiklash</button><p class="tiny">Tiklash oldingi ma'lumotlarni almashtiradi. JSON ichida shaxsiy qaydlar bo‘ladi.</p></div><div class="card stack">${data.founder?`<span class="badge">✦ FOUNDER READER</span><h3>Ilk kitobxonga maxsus xat</h3><p>VARAQ’ning birinchi sahifasidan boshlab bu sayohatda bo‘lganingiz uchun rahmat. Har bir kitob yangi fikrlar va go‘zal xotiralar olib kelsin. 📖</p>`:`<h3>Do‘st uchun sovg‘a</h3><p class="sub">Maxsus kod bilan Founder Reader belgisini oching.</p><input id="founder" placeholder="Maxsus kod"><button class="btn full outline" onclick="founder()">Belgini ochish</button>`}</div><p class="tiny" style="text-align:center">VARAQ 1.0 • Bepul brauzer demo • Lokal xotira</p></main>`}
function saveSettings(){const name=$('sname').value.trim(),d=Number($('sdaily').value),a=Number($('sannual').value);if(!name||d<1||a<1){toast("To‘g‘ri ma'lumot kiriting");return}Object.assign(data,{name,dailyGoal:d,annualGoal:a});save();render();toast('Sozlamalar saqlandi ✓')}
function founder(){if($('founder').value.trim().toUpperCase()!=='VARAQ-BIRINCHI'){toast('Kod noto‘g‘ri');return}data.founder=true;save();render();toast('Founder Reader ochildi! ✨')}
function navigate(t){clearInterval(timerRef);timerOn=false;view='';tab=t;if(t==='journal')noteFilter=0;render()}
function back(){if(view==='session'){clearInterval(timerRef);timerOn=false;view='detail'}else if(view==='edit'&&selectedId){view='detail'}else if(view==='newNote'){view='';tab='journal'}else view='';render()}
function exportBackup(){const contents={format:'VARAQ-BACKUP',version:1,exportedAt:Date.now(),settings:{name:data.name,dailyGoal:data.dailyGoal,annualGoal:data.annualGoal,darkMode:data.dark,founder:data.founder},books:data.books.map(b=>({id:b.id,title:b.title,author:b.author,totalPages:b.totalPages,currentPage:b.currentPage,status:b.status,genre:b.genre,coverBase64:b.cover?b.cover.split(',')[1]:'',rating:b.rating,review:b.review,createdAt:b.createdAt,startedAt:b.startedAt,finishedAt:b.finishedAt,updatedAt:b.updatedAt})),notes:data.notes,sessions:data.sessions};const blob=new Blob([JSON.stringify(contents,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='varaq-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Zaxira tayyor ✓')}
$('filePicker').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{let img=new Image();let url=URL.createObjectURL(file);await new Promise((ok,fail)=>{img.onload=ok;img.onerror=fail;img.src=url});let r=Math.min(1,420/img.width,600/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);editorCover=c.toDataURL('image/jpeg',.76);URL.revokeObjectURL(url);render();toast('Muqova tanlandi ✓')}catch{toast('Rasm ochilmadi')}e.target.value='' });
$('jsonPicker').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>25_000_000)throw Error('Fayl juda katta');const j=JSON.parse(await f.text());if(j.format!=='VARAQ-BACKUP'||j.version!==1||!Array.isArray(j.books)||!Array.isArray(j.notes)||!Array.isArray(j.sessions))throw Error('VARAQ backup emas');if(!confirm('Hozirgi ma’lumotlar almashtirilsinmi?'))return;const sett=j.settings||{};data={...initial(),name:String(sett.name||'Kitobxon'),dailyGoal:Math.max(1,Number(sett.dailyGoal)||20),annualGoal:Math.max(1,Number(sett.annualGoal)||20),dark:!!sett.darkMode,founder:!!sett.founder,books:j.books.map(b=>({...b,cover:b.coverBase64?'data:image/jpeg;base64,'+String(b.coverBase64).replace(/[^A-Za-z0-9+/=]/g,'') :''})),notes:j.notes,sessions:j.sessions};save();view='';tab='library';render();toast('Zaxira tiklandi ✓')}catch(err){toast('Import xatosi: '+err.message)}finally{e.target.value=''}});
render();
</script></body></html>
